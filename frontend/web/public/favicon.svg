<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8EF5"/>
      <stop offset="100%" stop-color="#0A4FA8"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Lettre N bold centrée — attributs SVG purs sans CSS ambigu -->
