services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: nere_user
      POSTGRES_PASSWORD: nere_pass
      POSTGRES_DB: nere_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nere_user -d nere_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request, sys; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=5); sys.exit(0)'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      DATABASE_URL: postgresql://nere_user:nere_pass@db:5432/nere_db
      CORS_ORIGINS: "http://localhost:4173,http://localhost:4174"
      ENVIRONMENT: development
      API_PREFIX: /api
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8100:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8100
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:5173"
    volumes:
      - ./frontend/web/src:/app/src
      - ./frontend/web/public:/app/public
      - ./frontend/web/index.html:/app/index.html
      - ./frontend/web/vite.config.js:/app/vite.config.js

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8100
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4174:4174"
    volumes:
      - ./admin/src:/app/src
      - ./admin/public:/app/public
      - ./admin/index.html:/app/index.html
      - ./admin/vite.config.js:/app/vite.config.js


volumes:
  db_data:
  backend_uploads:
