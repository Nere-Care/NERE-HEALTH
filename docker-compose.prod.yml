services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nere_db}
    volumes:
      - db_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nere_user} -d ${POSTGRES_DB:-nere_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request, sys; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=5); sys.exit(0)'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nere_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nere_db}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: production
      API_PREFIX: /api
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-https://neon-frangipane-27698e.netlify.app}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - backend_prod_uploads:/app/uploads

  # Inverse Proxy HTTPS automatique (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_API: ${DOMAIN_API:-api.nerehealth.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_prod_data:
  backend_prod_uploads:
  caddy_data:
  caddy_config:
